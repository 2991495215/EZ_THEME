        try {
            const theme = localStorage.getItem('theme');
            const resolved = theme === 'dark' || theme === 'light' ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.classList.toggle('dark-theme', resolved === 'dark');
            document.documentElement.style.colorScheme = resolved;
        } catch (_) {}

<body>
<div id="app"></div>
<div class="app-boot-state" id="appBootState" role="status" aria-live="polite">
    <div class="app-boot-card">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <p class="app-boot-title" id="appBootTitle">正在加载登录页面</p>
        <p class="app-boot-detail" id="appBootDetail">正在准备页面内容，请稍候。</p>
        <button type="button" class="app-boot-retry" onclick="location.reload()">重新加载</button>
    </div>
</div>
<script>
    (() => {
        let finished = false;
        const hash = location.hash;
        const isLanding = hash.startsWith('#/landing');
        const isAuthRoute = /^#\/(?:login|register|forgot-password|reset)(?:[/?]|$)/i.test(hash);
        const showFailure = () => {
            if (finished || !document.getElementById('appBootState')) return;
            const state = document.getElementById('appBootState');
            state.classList.add('is-error');
            document.getElementById('appBootTitle').textContent = isAuthRoute ? '登录页面加载失败' : '页面加载失败';
            document.getElementById('appBootDetail').textContent = '请检查网络后重新加载，无需先进入游客模式。';
        };
        if (isLanding) {
            document.getElementById('appBootTitle').textContent = '正在加载首页';
            document.getElementById('appBootDetail').textContent = '正在准备首页内容，请稍候。';
        } else if (!isAuthRoute) {
            document.getElementById('appBootTitle').textContent = '正在加载页面';
            document.getElementById('appBootDetail').textContent = '正在准备页面内容，请稍候。';
        }
        const isVisible = element => {
            if (!element) return false;
            const style = window.getComputedStyle(element);
            return style.display !== 'none'
                && style.visibility !== 'hidden'
                && Number.parseFloat(style.opacity || '1') >= 0.95
                && element.getBoundingClientRect().width > 0
                && element.getBoundingClientRect().height > 0;
        };
        const finish = () => {
            if (finished) return;
            const state = document.getElementById('appBootState');
            const target = isAuthRoute
                ? document.querySelector('#app .auth-container')
                : document.querySelector('#app > *');
            if (!state || !isVisible(target)) {
                window.requestAnimationFrame(finish);
                return;
            }
            finished = true;
            state.classList.add('is-ready');
            window.setTimeout(() => state.remove(), 220);
        };
        window.XBOARD_BOOT_FAIL = showFailure;
        window.requestAnimationFrame(finish);
        window.setTimeout(showFailure, 15000);
    })();
</script>

                    ['4. International processing and retention', 'Providers may process data outside your country. Where required, we use contractual or other recognized safeguards. Account, transaction, operational, security, and support records are retained only as needed to deliver services, troubleshoot, prevent abuse, and meet tax, accounting, and legal requirements.'],
                    ['5. Security', 'We use encryption in transit, access controls, credential protection, monitoring, and restricted administrative access. No system is completely secure. Use a unique password and contact us promptly if you suspect unauthorized access.'],
                    ['6. Your rights and cookies', 'Subject to applicable law, you may request access, correction, deletion, restriction, or a copy of your information; object to processing; withdraw consent; or close your account. Essential cookies and local storage support login, security, and language preferences. Blocking them may prevent account features from working.'],
                    ['7. Children, updates, and contact', 'The service is not directed to anyone under 18. We may update this Policy for legal, technical, or service changes and will publish a new effective date. Privacy and support requests: admin@zinc.run.']
                ]
            },
        };

        const languageByLabel = { '简体中文': 'zh-CN', English: 'en-US' };
        const getLanguage = () => {
            const selectedLabel = document.querySelector('.language-btn img[alt]')?.alt;
            return languageByLabel[selectedLabel] || (legalCopy[localStorage.getItem('language')] ? localStorage.getItem('language') : 'en-US');
        };
        const getCopy = () => legalCopy[getLanguage()];

        const renderDocument = () => {
            if (!activeDocument) return;
            const copy = getCopy();
            const isTerms = activeDocument === 'terms';
            const title = isTerms ? copy.termsTitle : copy.privacyTitle;
            const sections = isTerms ? copy.terms : copy.privacy;

            dialogTitle.textContent = title;
            dialogContent.replaceChildren();
            const meta = document.createElement('p');
            meta.className = 'legal-meta';
            meta.textContent = copy.effective;
            const intro = document.createElement('p');
            intro.className = 'legal-intro';
            intro.textContent = isTerms ? copy.termsIntro : copy.privacyIntro;
            dialogContent.append(meta, intro);
            sections.forEach(([heading, body]) => {
                const sectionHeading = document.createElement('h3');
                sectionHeading.textContent = heading;
                const paragraph = document.createElement('p');
                paragraph.textContent = body;
                dialogContent.append(sectionHeading, paragraph);
            });
            dialog.dir = 'ltr';
            closeButton.setAttribute('aria-label', copy.close);
            closeButton.title = copy.close;
        };

        const renderLabels = () => {
            const copy = getCopy();
            document.getElementById('pricingLabel').textContent = copy.pricing;
            document.getElementById('termsLabel').textContent = copy.termsTitle;
            document.getElementById('privacyLabel').textContent = copy.privacyTitle;
            document.getElementById('supportLabel').textContent = copy.support;
            if (dialog.open) renderDocument();

        };

        document.querySelectorAll('[data-legal-doc]').forEach(button => {
            button.addEventListener('click', () => {
                activeDocument = button.dataset.legalDoc;
                renderDocument();
                dialog.showModal();
            });
        });
        closeButton.addEventListener('click', () => dialog.close());
        dialog.addEventListener('click', event => {
            if (event.target === dialog) dialog.close();
        });

        const updateFooter = () => {
            const route = location.hash.replace(/^#\/?/, '').split(/[?&]/, 1)[0];
            const isLanding = route === '' || route === 'landing';
            footer.hidden = false;
            footer.classList.toggle('is-landing', isLanding);
        };

        updateFooter();
        renderLabels();
        window.addEventListener('hashchange', updateFooter);
        window.addEventListener('languageChanged', renderLabels);
        new MutationObserver(renderLabels).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    })();
</script>
</body>
</html>
